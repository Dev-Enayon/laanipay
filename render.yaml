services:
  - type: web
    name: laanipay-api
    runtime: node
    rootDir: backend
    region: oregon
    nodeVersion: 22.23.2
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://laanipay.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: LaaniPay <onboarding@resend.dev>
      - key: MAIL_REPLY_TO
        value: laanipay@gmail.com
      - key: FRONTEND_URL
        value: https://laanipay.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
