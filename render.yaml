services:
  - type: web
    # Must match the existing Render service (Render appended "-2fzb" when the
    # original "laanipay-api" name was taken by a stale deployment).
    name: laanipay-api-2fzb
    runtime: node
    rootDir: backend
    region: oregon
    nodeVersion: 22.23.2
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: SEED_FATAL=0 node prisma/seed.js; npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: LaaniPay <onboarding@resend.dev>
      - key: MAIL_REPLY_TO
        value: laanipay@gmail.com
      - key: FRONTEND_URL
        value: https://laanipay.vercel.app
      # Seed admin — set these in the Render dashboard. Without ADMIN_PASSWORD
      # the seed script generates one and prints it into the build logs.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
